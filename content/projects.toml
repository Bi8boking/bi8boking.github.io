[[items]]
title = "核磁共振测井探头磁场仿真"
subtitle = "青檬艾柯有限公司 · 实习"
date = "2026.11"
content = "我使用 Ansys Maxwell 完成测井探头的 B₀ 静磁场和 B₁ 射频场仿真，并联合计算相对敏感区，比较扰流天线通电前后的周向响应。"
details = """
- **探头建模与静磁场求解。** 我整理了探头的主磁体、端部磁体和软磁件，重建玻璃钢外筒。核对材料和充磁方向后，我将非线性 B–H 曲线录入软磁材料模型，并设置外部计算域和自适应网格。静磁场求解达到设定的收敛要求。
- **静磁场分布核对。** 我导出了纵截面云图、磁场矢量图和不同方位、不同离轴距离的轴向磁感应强度曲线，比较探头中段的平台和端部衰减，并核对取样方位对曲线的影响。
- **射频场对照仿真。** 我将主天线和馈线连接为连续导体，核对主天线与扰流天线的电流路径。在同一几何和网格上，我比较了仅主天线激励与双回路激励两种工况，提取同一截面上 B₁ 的复数分量，并计算与质子进动同向的有效激发场。
- **联合敏感区分析。** 我以 575 kHz 仿真工况为例，在同一截面对齐 B₀ 和 B₁，由拉莫尔频率筛选共振带，再叠加激发和接收权重。两组结果采用同一归一化基准。我绘制了敏感区分布、角向响应曲线和分扇区降幅图，发现扰流激励对截面两侧的抑制程度不同。
"""

[[items]]
title = "单边核磁共振仪的建模与磁场仿真"
subtitle = "青檬艾柯有限公司 · 实习"
date = "2026.11 · 进行中"
content = "我搭建了单边 NMR 探头的四磁块阵列与三匝线圈模型，完成首轮 B₀ 求解、共振位置分析和 B₁ 初算。正式射频场求解与三维敏感区评估正在推进。"
details = """
- **三维磁体建模。** 我在 Ansys Maxwell 中搭建了改进 U 形磁体结构，包括四块钕铁硼永磁体和参数化的纯铁磁轭。我为两组磁块设置相反的充磁方向，建立空气计算域和磁体局部网格，完成首轮三维磁静态求解。
- **B₀ 后处理与共振定位。** 我导出磁场的三个矢量分量，用 Python 生成正交截面云图、矢量图和中心及横向剖面。通过对中心线数据插值，我定位了 13 MHz 共振点并评估了局部梯度。在样品接触面与首轮线圈平面齐平的假设下，估算的中心共振深度约为 9.8 mm。
- **射频线圈与回流分析。** 我完成了三匝方形绕组和侧向回流路径的等效铜导体初模，并核对了闭合导体的连通性。我用 Biot–Savart 细线积分比较了仅绕组与含早期短回线两种工况，试算了两个正交剖面上的 B₁ 和相对敏感区。
- **当前进度。** 我正在复核线圈与回流几何。接下来将给线圈施加 13 MHz 电流激励，在 Maxwell 中求解正式 B₁ 场，并与 B₀ 在同一采样网格上计算三维相对响应，评估敏感区的横向尺寸、层厚和有效探测深度。
"""

